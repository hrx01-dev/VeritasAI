name: Backend Docker Validation

on:
  push:
    branches:
      - fix/deployable-backend
  pull_request:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t veritasai-backend ./backend

      - name: Start backend container
        run: |
          docker run -d --rm --name veritasai-backend -p 8000:8000 veritasai-backend
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/docs >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs veritasai-backend
          exit 1

      - name: Verify API and runtime dependencies
        run: |
          curl --fail --silent http://127.0.0.1:8000/docs >/dev/null
          docker exec veritasai-backend python -c "import torch, torchvision, transformers, cv2, timm; print('ML runtime imports OK'); print('torch', torch.__version__, 'cuda', torch.cuda.is_available()); print('torchvision', torchvision.__version__)"

      - name: Check video readiness endpoint
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/video/readiness >/tmp/video-readiness.json
          cat /tmp/video-readiness.json

      - name: Dump logs on failure
        if: failure()
        run: docker logs veritasai-backend || true

      - name: Stop container
        if: always()
        run: docker stop veritasai-backend || true
